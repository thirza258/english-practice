services:
  web:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "5170:5170"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-English Practice Diagnostic}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5170/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

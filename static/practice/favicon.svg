<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" role="img" aria-label="Union Jack">
  <rect width="60" height="60" fill="#012169"/>
  <!-- White saltire (St Andrew) -->
  <g fill="#FFFFFF">
    <rect x="-45" y="-6" width="90" height="12" transform="translate(30 30) rotate(45)"/>
    <rect x="-45" y="-6" width="90" height="12" transform="translate(30 30) rotate(-45)"/>
  </g>
  <!-- Red saltire (St Patrick), counterchanged -->
  <g fill="#C8102E">
    <rect x="-45" y="0" width="90" height="4" transform="translate(30 30) rotate(45)"/>
    <rect x="-45" y="0" width="90" height="4" transform="translate(30 30) rotate(-45)"/>
  </g>
  <!-- White fimbriation of St George's cross -->
  <rect x="20" y="0" width="20" height="60" fill="#FFFFFF"/>
  <rect x="0" y="20" width="60" height="20" fill="#FFFFFF"/>
  <!-- St George's cross -->
  <rect x="24" y="0" width="12" height="60" fill="#C8102E"/>
  <rect x="0" y="24" width="60" height="12" fill="#C8102E"/>
</svg>

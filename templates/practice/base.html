{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>{% block title %}English Practice Diagnostic{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A hidden-topic English grammar diagnostic with immediate feedback and topic-based results.{% endblock %}">
    <meta name="robots" content="{% block robots %}index,follow{% endblock %}">
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:site_name" content="English Practice Diagnostic">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}English Practice Diagnostic{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A hidden-topic English grammar diagnostic with immediate feedback and topic-based results.{% endblock %}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="{% static 'practice/styles.css' %}">
    {% block head_extra %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
